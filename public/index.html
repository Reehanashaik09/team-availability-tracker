<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Availability Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card h3 { margin: 0 0 5px 0; color: #34495e; }
        .card p { color: #7f8c8d; margin: 5px 0 15px 0; font-size: 14px; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; text-transform: uppercase; }
        .Available { background-color: #2ecc71; }
        .Busy { background-color: #e74c3c; }
        .Away { background-color: #f39c12; }
        .actions { margin-top: 15px; display: flex; gap: 8px; }
        button { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-available { background-color: #2ecc71; }
        .btn-busy { background-color: #e74c3c; }
        .btn-away { background-color: #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Team Availability Dashboard</h1>
        <div id="team-grid" class="grid"></div>
    </div>

    <script>
        async function fetchTeam() {
            try {
                const res = await fetch('/api/team');
                const data = await res.json();
                renderTeam(data);
            } catch (err) {
                console.error('Failed to load team data', err);
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`/api/team/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    fetchTeam(); // Refresh UI after update
                }
            } catch (err) {
                console.error('Failed to update status', err);
            }
        }

        function renderTeam(members) {
            const grid = document.getElementById('team-grid');
            grid.innerHTML = '';
            members.forEach(member => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${member.name}</h3>
                    <p>${member.role}</p>
                    <p>Status: <span class="badge ${member.status}">${member.status}</span></p>
                    <div class="actions">
                        <button class="btn-available" onclick="updateStatus('${member.id}', 'Available')">Available</button>
                        <button class="btn-busy" onclick="updateStatus('${member.id}', 'Busy')">Busy</button>
                        <button class="btn-away" onclick="updateStatus('${member.id}', 'Away')">Away</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Initial load and live polling every 4 seconds
        fetchTeam();
        setInterval(fetchTeam, 4000);
    </script>
</body>
</html>
